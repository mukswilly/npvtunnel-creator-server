# Release workflow for npvtunnel-creator-server.
#
# Trigger: push a semver tag (e.g. v0.1.0). Produces signed static linux
# amd64/arm64 binaries. No manual secrets required — cosign signs keylessly
# over OIDC and the release is created with the built-in GITHUB_TOKEN.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub release
  id-token: write   # cosign keyless signing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"

      - name: Test
        run: go test ./...

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Release binaries (goreleaser)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
